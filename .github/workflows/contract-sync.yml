name: Contract sync

on:
  workflow_call:
    inputs:
      context_ref:
        required: true
        type: string
      core_ref:
        required: true
        type: string
      compute_ref:
        required: true
        type: string
      web_ref:
        required: true
        type: string
      integration_ref:
        required: true
        type: string
    secrets:
      REFINVEST_CI_APP_PRIVATE_KEY:
        required: true
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: '17 0 * * *'
  workflow_dispatch:
    inputs:
      context_ref:
        description: Context commit or ref for candidate verification
        type: string
      core_ref:
        description: Core API commit or ref
        type: string
      compute_ref:
        description: Compute API commit or ref
        type: string
      web_ref:
        description: Web commit or ref
        type: string
      integration_ref:
        description: Integration commit or ref
        type: string

permissions:
  contents: read

jobs:
  verify:
    name: Verify Context/Core/Compute/Web snapshots
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout integration
        uses: actions/checkout@v4
        with:
          path: integration
          ref: ${{ inputs.integration_ref || github.sha }}

      - name: Create read-only sibling checkout token
        id: sibling-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.REFINVEST_CI_APP_CLIENT_ID }}
          private-key: ${{ secrets.REFINVEST_CI_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: |
            context
            core-api
            compute-api
            web
          permission-contents: read

      - name: Checkout context
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/context
          token: ${{ steps.sibling-token.outputs.token }}
          path: context
          ref: ${{ inputs.context_ref || 'main' }}
          fetch-depth: 0

      - name: Checkout Core API
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/core-api
          token: ${{ steps.sibling-token.outputs.token }}
          path: api/refinvest
          ref: ${{ inputs.core_ref || 'main' }}

      - name: Checkout Compute API
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/compute-api
          token: ${{ steps.sibling-token.outputs.token }}
          path: compute-api/refinvest
          ref: ${{ inputs.compute_ref || 'main' }}

      - name: Checkout Web
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/web
          token: ${{ steps.sibling-token.outputs.token }}
          path: web/web
          ref: ${{ inputs.web_ref || 'main' }}

      - name: Set up Python for Analytics contract verification
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Analytics contract verifier dependencies
        run: python -m pip install -r integration/scripts/requirements-contract-sync.txt

      - name: Test propagation policy and evidence binding
        run: |
          python -B -m unittest discover -s integration/scripts -p 'test_contract_*.py'
          python -B -m unittest discover -s integration/scripts -p 'test_publish_contract_sync.py'

      - name: Verify OpenAPI snapshots
        id: contract-sync
        shell: pwsh
        working-directory: integration
        run: ./scripts/verify-contract-sync.ps1 -IncludeWeb

      - name: Verify Core document snapshots
        id: core-doc-sync
        if: always()
        shell: pwsh
        working-directory: integration
        run: >-
          ../api/refinvest/scripts/verify-context-doc-sync.ps1
          -ContextPath ../context

      - name: Resolve snapshot verification outcome
        id: snapshot-sync
        if: always()
        shell: pwsh
        run: |
          $outcomes = @(
            '${{ steps.contract-sync.outcome }}',
            '${{ steps.core-doc-sync.outcome }}'
          )
          if ($outcomes -contains 'failure') {
            'outcome=failure' >> $env:GITHUB_OUTPUT
          }
          elseif ($outcomes -contains 'cancelled') {
            'outcome=cancelled' >> $env:GITHUB_OUTPUT
          }
          elseif (@($outcomes | Where-Object { $_ -ne 'success' }).Count -gt 0) {
            'outcome=skipped' >> $env:GITHUB_OUTPUT
          }
          else {
            'outcome=success' >> $env:GITHUB_OUTPUT
          }

      - name: Record tested revisions
        if: always()
        shell: pwsh
        working-directory: integration
        run: >-
          ./scripts/write-compatibility-evidence.ps1
          -VerificationName snapshot-sync
          -VerificationOutcome '${{ steps.snapshot-sync.outputs.outcome }}'
          -RequiredRepositories context,coreApi,computeApi,web,integration

      - name: Upload compatibility evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: contract-sync-compatibility-evidence-${{ github.run_attempt }}
          path: integration/.integration-data/evidence/compatibility.json
          if-no-files-found: warn
