name: API smoke

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: api-smoke-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Core to Compute API smoke
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: refinvest_integration
          POSTGRES_USER: refinvest
          POSTGRES_PASSWORD: refinvest-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U refinvest -d refinvest_integration"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30

    steps:
      - name: Checkout integration
        uses: actions/checkout@v4
        with:
          path: integration

      - name: Create read-only sibling checkout token
        id: sibling-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.REFINVEST_CI_APP_CLIENT_ID }}
          private-key: ${{ secrets.REFINVEST_CI_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: |
            context
            core-api
            compute-api
          permission-contents: read

      - name: Checkout context
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/context
          token: ${{ steps.sibling-token.outputs.token }}
          path: context

      - name: Checkout Core API
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/core-api
          token: ${{ steps.sibling-token.outputs.token }}
          path: api/refinvest

      - name: Checkout Compute API
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/compute-api
          token: ${{ steps.sibling-token.outputs.token }}
          path: compute-api/refinvest

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
          cache-dependency-path: api/refinvest/**/*.gradle.kts

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up uv
        uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
          cache-dependency-glob: compute-api/refinvest/uv.lock

      - name: Install Compute dependencies
        working-directory: compute-api/refinvest
        run: uv sync --frozen

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install --yes postgresql-client

      - name: Run isolated API smoke
        shell: pwsh
        working-directory: integration
        run: |
          ./scripts/new-ci-environment.ps1
          ./scripts/run-api-smoke-ci.ps1

      - name: Upload integration logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-smoke-logs
          path: integration/.integration-data/logs
          if-no-files-found: warn
