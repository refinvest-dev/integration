name: API smoke

on:
  workflow_call:
    inputs:
      context_ref:
        required: true
        type: string
      core_ref:
        required: true
        type: string
      compute_ref:
        required: true
        type: string
      web_ref:
        required: true
        type: string
      integration_ref:
        required: true
        type: string
    secrets:
      REFINVEST_CI_APP_PRIVATE_KEY:
        required: true
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      context_ref:
        description: Context commit or ref for candidate verification
        type: string
      core_ref:
        description: Core API commit or ref
        type: string
      compute_ref:
        description: Compute API commit or ref
        type: string
      web_ref:
        description: Web commit or ref
        type: string
      integration_ref:
        description: Integration commit or ref
        type: string

permissions:
  contents: read

concurrency:
  group: api-smoke-${{ github.workflow }}-${{ github.event_name }}-${{ inputs.context_ref && github.run_id || github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Core to Compute API smoke and Web browser acceptance
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: refinvest_integration
          POSTGRES_USER: refinvest
          POSTGRES_PASSWORD: refinvest-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U refinvest -d refinvest_integration"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30

    steps:
      - name: Checkout integration
        uses: actions/checkout@v4
        with:
          path: integration
          ref: ${{ inputs.integration_ref || github.sha }}

      - name: Create read-only sibling checkout token
        id: sibling-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.REFINVEST_CI_APP_CLIENT_ID }}
          private-key: ${{ secrets.REFINVEST_CI_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: |
            context
            core-api
            compute-api
            web
          permission-contents: read

      - name: Checkout context
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/context
          token: ${{ steps.sibling-token.outputs.token }}
          path: context
          ref: ${{ inputs.context_ref || 'main' }}
          fetch-depth: 0

      - name: Checkout Core API
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/core-api
          token: ${{ steps.sibling-token.outputs.token }}
          path: api/refinvest
          ref: ${{ inputs.core_ref || 'main' }}

      - name: Checkout Compute API
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/compute-api
          token: ${{ steps.sibling-token.outputs.token }}
          path: compute-api/refinvest
          ref: ${{ inputs.compute_ref || 'main' }}

      - name: Checkout Web
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/web
          token: ${{ steps.sibling-token.outputs.token }}
          path: web/web
          ref: ${{ inputs.web_ref || 'main' }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: web/web/pnpm-lock.yaml

      - name: Install Web dependencies and Chromium
        working-directory: web/web
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
          cache-dependency-path: api/refinvest/**/*.gradle.kts

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Analytics contract verifier dependencies
        run: python -m pip install -r integration/scripts/requirements-contract-sync.txt

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: compute-api/refinvest/uv.lock

      - name: Install Compute dependencies
        working-directory: compute-api/refinvest
        run: uv sync --frozen

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install --yes postgresql-client

      - name: Run isolated API smoke and Web browser acceptance
        id: integration-smoke
        shell: pwsh
        working-directory: integration
        run: |
          ./scripts/new-ci-environment.ps1
          ./scripts/run-web-acceptance-ci.ps1

      - name: Record tested revisions
        if: always()
        shell: pwsh
        working-directory: integration
        run: >-
          ./scripts/write-compatibility-evidence.ps1
          -VerificationName api-smoke-and-web-acceptance
          -VerificationOutcome '${{ steps.integration-smoke.outcome }}'
          -RequiredRepositories context,coreApi,computeApi,web,integration

      - name: Upload compatibility evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-smoke-and-web-acceptance-compatibility-evidence-${{ github.run_attempt }}
          path: integration/.integration-data/evidence/compatibility.json
          if-no-files-found: warn

      - name: Upload integration logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-smoke-and-web-acceptance-logs-${{ github.run_attempt }}
          path: integration/.integration-data/logs
          if-no-files-found: warn
