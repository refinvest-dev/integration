global:
  scrape_interval: 5s
  evaluation_interval: 5s
scrape_configs:
  - job_name: core-api
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['127.0.0.1:8080']
    basic_auth:
      username: prometheus
      password_file: .integration-data/observability/core-metrics-password
  - job_name: compute-api
    metrics_path: /metrics
    static_configs:
      - targets: ['127.0.0.1:9101']
  - job_name: compute-worker
    metrics_path: /metrics
    static_configs:
      - targets: ['127.0.0.1:9102']
